# Databricks App configuration for the MCP Job Server
# Deploys as a persistent HTTP service using the Streamable HTTP transport (/mcp).

command:
  - "python"
  - "app.py"

env:
  - name: WORKSPACE_REPO_PATH
    description: "Workspace Git folder path — the deploy tool pulls latest code here"
    value: "/Workspace/Users/you@example.com/mcp-databricks-jobs"
