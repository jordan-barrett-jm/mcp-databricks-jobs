# Declarative Automation Bundle configuration
# Defines a serverless job that runs a simple data transformation.

bundle:
  name: sample_transform_bundle

workspace:
  root_path: ~/.bundle/${bundle.name}/${bundle.target}

# Whoever runs `bundle deploy` becomes the owner, and `mode: development`
# scopes the deployment to that principal. The hosted MCP app deploys as its
# own service principal, so without this its job is invisible to the human who
# asked for it -- not even View permission.
permissions:
  - level: CAN_MANAGE
    user_name: jordan.barrett@factored.ai
  # Both principals deploy this bundle, so both are named explicitly. Without
  # its own entry the CLI warns that CAN_MANAGE grants only take effect when
  # the deploying identity is itself listed.
  - level: CAN_MANAGE
    service_principal_name: 3a75ae6d-6747-4a0a-a764-bab29932cde2

resources:
  jobs:
    sample_transform_job:
      name: sample_transform_job_${bundle.target}
      description: "Ingest raw orders, then publish completed-order revenue by region — deployed via DAB, driven by the MCP server"
      tags:
        managed_by: "mcp-server"
        bundle: "sample_transform_bundle"

      # Target for both tasks. Job parameters reach notebook tasks as widgets,
      # so the notebooks read them with dbutils.widgets.get().
      parameters:
        - name: catalog
          default: bronze_sandbox_typo
        - name: schema
          default: mcp_jobs_demo

      # Serverless — no cluster spec required
      tasks:
        - task_key: ingest_orders
          notebook_task:
            notebook_path: ./src/ingest_orders.py

        - task_key: aggregate_sales
          depends_on:
            - task_key: ingest_orders
          notebook_task:
            notebook_path: ./src/aggregate_sales.py

      # Queue to prevent resource contention
      queue:
        enabled: true

      # Email notifications on failure (customize as needed)
      # email_notifications:
      #   on_failure:
      #     - your-email@company.com

targets:
  dev:
    default: true
    mode: development

  prod:
    mode: production
    resources:
      jobs:
        sample_transform_job:
          name: sample_transform_job_prod
          schedule:
            # Example: run daily at 6 AM UTC — uncomment to enable
            # quartz_cron_expression: "0 0 6 * * ?"
            # timezone_id: "UTC"
            pause_status: PAUSED
